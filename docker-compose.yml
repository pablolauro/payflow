services:
  postgres:
    image: postgres:16
    container_name: payflow-postgres
    restart: always
    environment:
      POSTGRES_DB: payflow
      POSTGRES_USER: payflow
      POSTGRES_PASSWORD: payflow
    ports:
      - "5432:5432"
    volumes:
      - payflow_pgdata:/var/lib/postgresql/data
      
volumes:
 payflow_pgdata: